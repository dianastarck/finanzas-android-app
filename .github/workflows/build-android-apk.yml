name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate app project
        run: |
          set -e
          echo "Buscando proyecto Capacitor..."
          if [ -f "www/index.html" ] && [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Proyecto encontrado en la raíz."
          else
            ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP_FILE" ]; then
              echo "No encontré carpeta www/index.html ni un ZIP para descomprimir."
              echo "Subí el proyecto descomprimido o dejá el ZIP original en la raíz."
              exit 1
            fi
            echo "Descomprimiendo $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d extracted
            PROJECT_DIR=$(find extracted -maxdepth 3 -name package.json -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "No encontré package.json dentro del ZIP."
              exit 1
            fi
            if [ ! -f "$PROJECT_DIR/www/index.html" ]; then
              echo "Encontré package.json en $PROJECT_DIR, pero falta www/index.html."
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
            echo "Proyecto encontrado en: $PROJECT_DIR"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Add Android platform if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-ahorro-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
